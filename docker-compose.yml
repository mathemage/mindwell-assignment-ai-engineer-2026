version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindwell-postgres
    environment:
      POSTGRES_DB: mindwell
      POSTGRES_USER: mindwell
      POSTGRES_PASSWORD: mindwell_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindwell"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindwell-backend
    environment:
      DATABASE_URL: postgresql+psycopg://mindwell:mindwell_dev_password@postgres:5432/mindwell
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  backend_cache:
